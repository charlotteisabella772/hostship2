name: Host-Ship Auto Renew

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Renew Server via API Key
        run: |
          API_KEY="${{ secrets.PANEL_API_KEY }}"
          RESPONSE_FILE=$(mktemp)
          
          echo "正在发送 API 续期请求..."

          HTTP_CODE=$(curl -s -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://panel.host-ship.com/api/client/servers/60d19106-a952-4b07-af68-5759c0cba7d0/renew")
          
          echo "HTTP Response Code: $HTTP_CODE"
          echo "--- Response Body ---"
          cat "$RESPONSE_FILE"
          echo "---------------------"
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
            echo "Renewal request sent successfully!"
          else
            echo "Error: Renewal failed with code $HTTP_CODE"
            exit 1
          fi
